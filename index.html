<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Sway</title><meta name="description" content="Sway: ask your trusted friends before you decide."><meta name="theme-color" content="#F6F5FB"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sway"><meta property="og:title" content="Sway"><meta property="og:description" content="Ask your trusted friends before you decide."><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="config.js"></script><script>if(window.SWAY_CONFIG&&SWAY_CONFIG.url&&SWAY_CONFIG.key)document.write('<script src="vendor/supabase.js"><\/script>')</script></head><body>
<title>Sway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&display=swap">
<style>
/* Layout: one app column (full screen on a phone, centred on a computer). Five labelled tabs on a floating bar;
   every question, circle or form opens as its own page with a back arrow. Every question carries its own colour. */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --sunk:#F0EEF7; --line:#E7E3F1; --ink:#17132B; --ink2:#6B6683;
  --accent:#7C3AED; --accent-soft:#F1EAFF; --accent-ink:#5B21B6;
  --hot:#E11D48; --hot-soft:#FFE4EA; --ok:#047857; --ok-soft:#DCFCEB;
  --brand:linear-gradient(120deg,#7C3AED,#EC4899 60%,#F97316);
  --lift:0 1px 2px rgba(23,19,43,.05),0 12px 28px -16px rgba(76,29,149,.32);
  --tabbar:rgba(255,255,255,.88); --outer:#ECE9F6;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F0D18; --surface:#1A1727; --sunk:#242036; --line:#2E2944; --ink:#F6F4FF; --ink2:#ADA7C6;
  --accent:#A78BFA; --accent-soft:#2A2148; --accent-ink:#D8CCFF; --hot:#FB7185; --hot-soft:#3A1622; --ok:#6EE7B7; --ok-soft:#10301F;
  --lift:0 14px 30px -18px rgba(0,0,0,.8); --tabbar:rgba(26,23,39,.9); --outer:#07060C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F0D18; --surface:#1A1727; --sunk:#242036; --line:#2E2944; --ink:#F6F4FF; --ink2:#ADA7C6;
  --accent:#A78BFA; --accent-soft:#2A2148; --accent-ink:#D8CCFF; --hot:#FB7185; --hot-soft:#3A1622; --ok:#6EE7B7; --ok-soft:#10301F;
  --lift:0 14px 30px -18px rgba(0,0,0,.8); --tabbar:rgba(26,23,39,.9); --outer:#07060C; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0}
body{margin:0;background:var(--outer);color:var(--ink);font:500 16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.03em;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

.app{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);max-width:560px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(76,29,149,.5)}}
.app::before{content:"";position:absolute;inset:-120px -80px auto;height:340px;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side at 22% 55%,rgba(124,58,237,.26),transparent),radial-gradient(closest-side at 72% 40%,rgba(236,72,153,.2),transparent),radial-gradient(closest-side at 95% 75%,rgba(249,115,22,.16),transparent)}
.page{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.page>*{flex-shrink:0}
.page,.land{overscroll-behavior:none}
.page.in{animation:in .24s cubic-bezier(.2,.8,.2,1)}
.page.back{animation:out .24s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateX(22px);opacity:.3}}
@keyframes out{from{transform:translateX(-22px);opacity:.3}}
.page.still .big{animation:none}

/* bars */
.bar{display:flex;align-items:center;gap:8px;min-height:50px}
.bar h1{flex:1;font-size:32px;font-weight:800}
.bar h2{flex:1;font-size:17px;font-weight:800;text-align:center}
.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:var(--lift);flex:none;position:relative}
.ib .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#EC4899;border:2px solid var(--surface)}
.spacer{width:44px;flex:none}
.tabs{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:6px;
  border-radius:26px;background:var(--tabbar);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 14px 34px -14px rgba(76,29,149,.45);border:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;color:var(--ink2);font-size:11px;font-weight:700;position:relative;border-radius:18px;text-align:center}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#EC4899;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.tab.ask{color:var(--ink)}
.tab.ask span.plus{width:52px;height:42px;border-radius:16px;background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -8px rgba(236,72,153,.7)}

/* vote home */
.hello{display:flex;align-items:center;gap:12px;min-height:56px}
.hello .tx{flex:1;min-width:0}
.hello h1{font-size:30px;font-weight:800;line-height:1.05}
.hello p{color:var(--ink2);font-weight:600;font-size:15px;margin-top:3px}
.friends{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:4px 16px 2px;scrollbar-width:none}
.friends::-webkit-scrollbar{display:none}
.fr{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;font-size:12px;font-weight:700;color:var(--ink2);text-align:center}
.fr .ring{width:64px;height:64px;border-radius:50%;padding:3px;background:var(--line)}
.fr.on .ring{background:var(--brand)}
.fr.on{color:var(--ink)}
.fr .ring .av{width:100%;height:100%;font-size:17px;border:3px solid var(--bg)}
.fr.inv .ring{background:transparent;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.fr span.nm{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{position:relative;overflow:hidden;border-radius:32px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:16px;min-height:360px;box-shadow:0 26px 50px -26px rgba(124,58,237,.75);animation:deal .38s cubic-bezier(.2,.9,.25,1.05)}
@keyframes deal{from{transform:translateY(26px) rotate(-2deg) scale(.96);opacity:0}}
.big::before{content:"";position:absolute;right:-70px;top:-80px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.14)}
.big::after{content:"";position:absolute;left:-60px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.10)}
.big>*{position:relative;z-index:1}
.who{display:flex;align-items:center;gap:12px}
.big .who .av{width:52px;height:52px;font-size:16px;border:3px solid rgba(255,255,255,.9)}
.who .wt{flex:1;min-width:0;line-height:1.25;font-weight:700;font-size:14px}
.big .who .wt b{display:block;font-size:17px;font-weight:800}
.count{background:rgba(255,255,255,.22);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.big h2{font-size:28px;line-height:1.1;font-weight:800;flex:1;display:flex;align-items:center;overflow-wrap:anywhere}
.big .note{font-weight:600;opacity:.95;margin-top:-8px}
.ans{display:flex;flex-direction:column;gap:10px}
.big .ans button{min-height:58px;border-radius:20px;background:#fff;color:#17132B;font-weight:800;font-size:17px;padding:10px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 18px -10px rgba(0,0,0,.4);transition:transform .12s ease;overflow-wrap:anywhere}
.big .ans button:active{transform:scale(.97)}
.k{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;flex:none}
.big .foot{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700}
.faces{display:flex}.faces .av{border:2.5px solid #fff;margin-right:-8px;width:30px;height:30px;font-size:10px}
.big .foot .go{margin-left:auto;font-weight:800;opacity:.92;padding:8px 2px}
.big .reply{display:flex;gap:8px}
.big .reply input{flex:1;min-width:0;height:54px;border-radius:18px;border:0;padding:0 16px;background:#fff;color:#17132B;font-weight:600}
.big .reply button{height:54px;padding:0 18px;border-radius:18px;background:#17132B;color:#fff;font-weight:800}
.mask{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:rgba(255,255,255,.22);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:800}
.anonv{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:40px;padding:0 14px;border-radius:99px;font-weight:800;font-size:13.5px}
.big .anonv{background:rgba(255,255,255,.2);color:#fff}
.big .anonv[aria-pressed="true"]{background:#fff;color:#17132B}
.page>.anonv{background:var(--surface);box-shadow:var(--lift)}
.page>.anonv[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.anonv .box2{width:18px;height:18px;border-radius:6px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center}
.big .stamp{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:800;color:#fff;opacity:0;pointer-events:none}
.big .stamp i{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;transform:scale(.3)}
.big.stamped .stamp{opacity:1;transition:opacity .15s}
.big.stamped .stamp i{transform:scale(1);transition:transform .35s cubic-bezier(.2,1.5,.3,1)}
.big.stamped>*:not(.stamp){opacity:.15;transition:opacity .15s}
.carousel{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.rcard{flex:none;width:230px;scroll-snap-align:start;border-radius:26px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:10px;min-height:180px;box-shadow:0 18px 32px -20px rgba(124,58,237,.7);position:relative;overflow:hidden;text-align:left}
.rcard::after{content:"";position:absolute;right:-40px;bottom:-50px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.15)}
.rcard small{font-size:12px;font-weight:800;opacity:.92}
.rcard b{font-size:17px;font-weight:800;line-height:1.2;flex:1;position:relative;overflow-wrap:anywhere}
.rcard .seal{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:#fff;color:#17132B;border-radius:99px;padding:8px 14px;font-weight:800;font-size:13.5px;position:relative;z-index:1}
.rcard .win{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.05;position:relative;overflow-wrap:anywhere}

/* lists */
.label{font-size:13px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;padding:6px 2px 0}
.label i{width:8px;height:8px;border-radius:50%}
.label .n{color:var(--ink2);font-weight:700}
.sublabel{font-size:12.5px;font-weight:700;color:var(--ink2);padding:2px 4px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--lift);transition:transform .15s ease}
.row:active{transform:scale(.98)}
.tile{width:50px;height:50px;border-radius:17px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tx b{font-weight:800;font-size:15.5px;line-height:1.28;letter-spacing:-.015em;overflow-wrap:anywhere}
.row .tx span{font-size:13px;color:var(--ink2);font-weight:600}
.pill{flex:none;font-size:12px;font-weight:800;padding:6px 10px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.hot{background:var(--hot-soft);color:var(--hot)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.v{background:var(--accent-soft);color:var(--accent-ink)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;color:#17132B}
.av.out{opacity:.35;filter:grayscale(1)}
.empty{background:var(--surface);border-radius:24px;padding:26px;text-align:center;color:var(--ink2);box-shadow:var(--lift)}
.empty b{display:block;color:var(--ink);font-size:19px;font-weight:800;margin-bottom:4px}
.empty .btn{margin-top:14px}
.mcard{border-radius:26px;background:var(--surface);box-shadow:var(--lift);overflow:hidden}
.mcard .top{padding:16px 16px 18px;color:#fff;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.mcard .top small{font-weight:800;font-size:12px;opacity:.92}
.mcard .top .newv{align-self:flex-start;background:#fff;color:#17132B;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:800;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.mcard .top b{font-size:20px;font-weight:800;line-height:1.15;letter-spacing:-.03em;overflow-wrap:anywhere}
.mcard .body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.bar2{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:99px}
.ppl{display:flex;align-items:center;gap:10px}
.ppl .faces .av{width:32px;height:32px;font-size:10.5px;border:2.5px solid var(--surface)}
.ppl span.t{flex:1;font-size:13.5px;font-weight:700;color:var(--ink2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:800;background:var(--ink);color:var(--bg);text-align:center}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 12px 24px -12px rgba(236,72,153,.8)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.btn.danger{background:var(--surface);color:var(--hot);box-shadow:var(--lift)}
.btn.off{background:var(--sunk);color:var(--ink2);box-shadow:none}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{font-weight:800;color:var(--accent);padding:8px 2px;min-height:40px}

/* question page */
.qhero{position:relative;overflow:hidden;border-radius:28px;padding:18px 18px 22px;color:#fff;display:flex;flex-direction:column;gap:14px}
.qhero::after{content:"";position:absolute;right:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14)}
.qhero .who .av{border:2px solid rgba(255,255,255,.8)}
.qhero .who .wt{font-size:13.5px;opacity:.95}
.qhero .t{background:rgba(255,255,255,.22);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.qhero h1{font-size:27px;line-height:1.12;font-weight:800;position:relative;overflow-wrap:anywhere}
.qhero .note{position:relative;font-weight:600;opacity:.95}
.verdict{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:18px;color:#fff;font-weight:800;position:relative;background:rgba(255,255,255,.22)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:16.5px;font-weight:800}
.box{background:var(--surface);border-radius:22px;padding:6px 14px;display:flex;flex-direction:column;box-shadow:var(--lift)}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;border-radius:20px;background:var(--surface);box-shadow:var(--lift);font-weight:800;font-size:16px;transition:transform .12s ease}
.opt:not(:disabled):active{transform:scale(.98)}
.opt .k{position:relative;background:var(--sunk);color:var(--ink2)}
.opt .l{position:relative;flex:1;overflow-wrap:anywhere}
.opt .p{position:relative;font-weight:800;font-size:16px}
.opt .f{position:absolute;inset:0 auto 0 0;opacity:.16;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.opt.win .f{opacity:.28}
.opt.mine{color:#fff}
.opt.mine .k{background:rgba(255,255,255,.25);color:#fff}
.opt:disabled{cursor:default}
.status{font-size:14px;font-weight:700;color:var(--accent-ink);display:flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.status svg{flex:none}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--ink2)}
.privacy svg{flex:none;margin-top:2px;color:var(--accent)}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person b{flex:1;min-width:0;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.cmts{display:flex;flex-direction:column;gap:4px}
.cmt{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.cmt.cont{margin-top:0}
.cmt .av{width:30px;height:30px;font-size:10.5px}
.cmt.cont .av{visibility:hidden}
.cmt .cb{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:80%}
.cmt .cn{font-size:12px;font-weight:700;color:var(--ink2);padding:0 8px}
.cmt .cn i{font-style:normal;font-weight:600;opacity:.8}
.cmt p{background:var(--surface);padding:9px 14px;border-radius:20px 20px 20px 6px;font-size:15px;line-height:1.4;box-shadow:var(--lift);overflow-wrap:anywhere}
.cmt.mine{justify-content:flex-end}
.cmt.mine .cb{align-items:flex-end}
.cmt.mine p{background:linear-gradient(120deg,#7C3AED,#C026D3);color:#fff;border-radius:20px 20px 6px 20px;box-shadow:none}
.cmts .none{font-size:14px;color:var(--ink2);font-weight:600}
.say{display:flex;gap:8px}
.say input{flex:1;min-width:0;height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);box-shadow:var(--lift)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff}
.chip .st{color:#F59E0B;display:inline-flex;vertical-align:-3px;margin-right:4px}
.chip[aria-pressed="true"] .st{color:#fff}
.chips.warn .chip{box-shadow:inset 0 0 0 2px var(--hot)}
.need{font-size:14px;font-weight:700;color:var(--hot);padding:0 4px}
.hint{font-size:13px;color:var(--ink2);font-weight:600;padding:0 4px}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph{position:relative;display:block;width:100%;border-radius:20px;overflow:hidden;background:var(--sunk);box-shadow:var(--lift);text-align:left;transition:transform .12s ease}
.ph:not(:disabled):active{transform:scale(.97)}
.ph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.ph .cap{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.94);color:#17132B;font-weight:800;font-size:13.5px}
.ph .cap .k{width:24px;height:24px;border-radius:8px;font-size:11.5px}
.ph .cap .p{margin-left:auto}
.ph .cap span.c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph.mine{box-shadow:0 0 0 3.5px #fff,0 0 0 6px var(--accent)}

    var pids=rows.map(function(p){return p.row.id});
    return Promise.all([pids.length?sb.rpc('poll_states',{ids:pids}):{data:[]},pids.length?sb.from('comments').select('poll_id,user_id,body,created_at').in('poll_id',pids).order('created_at'):{data:[]},
      NUDGES?soft(sb.from('nudges').select('poll_id,to_user,from_user')):{data:[]}]);
  }).then(function(rs){
    must(rs[0]).forEach(function(v){st[v.poll_id]=v});
    must(rs[1]).forEach(function(c){(cm[c.poll_id]||(cm[c.poll_id]=[])).push({by:mapId(c.user_id),text:c.body,t:Date.parse(c.created_at)})});
    must(rs[2]).forEach(function(n){ if(n.to_user===who) nb[n.poll_id]=mapId(n.from_user); else (nt[n.poll_id]||(nt[n.poll_id]=[])).push(n.to_user) });
    if(who!==ME) return;
    var old={},firstLoad=!S.loaded; S.polls.forEach(function(p){old[p.id]=p});
    var next=rows.map(function(x){
      var r=x.row,o=old[r.id],mine=r.mine===true||r.author===who;
      var p={id:r.id,by:mine?'me':(r.author?mapId(r.author):'anon'),circles:x.circles,q:r.q,note:r.note||'',type:r.type==='match'?'choice':r.type,opts:(r.opts||[]).map(function(o){return typeof o==='string'?{t:o}:o}),
        created:Date.parse(r.created_at),closes:Date.parse(r.closes_at),anon:!!r.anon,live:!!r.live,who:r.who!==false,early:!!r.early,allowPrivate:r.allow_private!==false,hideAsker:!!r.hide_asker,
        votes:{},voted:[],nVoted:null,counts:null,comments:cm[r.id]||[],nudgedTo:nt[r.id]||[],nudgedBy:nb[r.id]||null,hidV:{},myHidden:false};
      if(st[r.id]) applyState(p,st[r.id]);
      /* a vote made a moment ago must not be undone by a load that started before it */
      if(o&&o.votes.me!=null&&p.votes.me==null&&!isClosed(p)&&now()-(o.votedAt||0)<8000){ p.votes.me=o.votes.me; if(p.voted.indexOf('me')<0) p.voted.push('me') }
      if(o&&o.votedAt) p.votedAt=o.votedAt;
      var nm=p.by==='anon'?'Someone':p.by==='me'?'You':first(p.by);
      if(!firstLoad){
        if(!o&&p.by!=='me'&&!isClosed(p)){ addAct('poll',p.id,nm+' asked '+cname(p)+': '+p.q); toast(nm+' asked a question','Vote',function(){ setTab('vote') }) }
        if(o&&!isClosed(o)&&isClosed(p)&&involved(p)&&!S.seen[p.id]){ addAct('verdict',p.id,'The verdict is in: '+p.q); toast('The verdict is in','Reveal',function(){ reveal(p.id) }) }
        if(p.nudgedBy&&!(o&&o.nudgedBy)&&!isClosed(p)&&!hasVoted(p,'me')){ addAct('nudge',p.id,first(p.nudgedBy)+' is waiting on your vote: '+p.q); toast(first(p.nudgedBy)+' nudged you','Vote',function(){ go('q',p.id) }) }
        if(o&&p.by==='me'&&turn(p).n>turn(o).n&&!isClosed(p)) voteAct(p,o);
        if(o&&p.by!=='me'&&hasVoted(p,'me')&&!isClosed(p)&&turn(p).total&&turn(p).n>=turn(p).total&&turn(o).n<turn(o).total){
          var ev='Everyone has '+(isOpen(p)?'replied':'voted'); addAct('allin',p.id,ev+': '+p.q);
          toast(ev+(p.early&&!isOpen(p)?' · result in 30s':''),'See',function(){ go('q',p.id) }) }
        if(o&&involved(p)&&p.comments.length>o.comments.length){ var lc=p.comments[p.comments.length-1]; if(lc.by!=='me') addAct('comment',p.id,first(lc.by)+' commented on: '+p.q) }
      } else if(isClosed(p)&&now()-p.closes>3*DAY) S.seen[p.id]=true;
      return p;
    });
    /* questions or circles made a moment ago, which this load could not know about yet */
    S.polls.forEach(function(o){ if(o.pendingAt&&now()-o.pendingAt<20000&&!pm[o.id]) next.push(o) });
    var keepC=S.circles.filter(function(c){return c.pendingAt&&now()-c.pendingAt<20000&&!cmap[c.id]});
    var usedOld={}; S.circles.forEach(function(c){usedOld[c.id]=c.used||0});
    var lastAsk={}; next.forEach(function(p){ if(p.by==='me') p.circles.forEach(function(c){ lastAsk[c]=Math.max(lastAsk[c]||0,p.created) }) });
    if(myName) S.me.name=myName;
    S.friends=friends;
    S.circles=cids.map(function(k){var c=cmap[k]; c.star=!!stars[k]; c.used=Math.max(usedOld[k]||0,lastAsk[k]||0); return c}).concat(keepC);
    S.polls=next; S.loaded=true; warned=false;
    if(!S.seenV){ S.seenV={}; next.forEach(function(p){ if(p.by==='me') S.seenV[p.id]=turn(p).n }) }
    saveLocal();
    joinChannels(cids); refresh();
    if(ONLOAD){ var f=ONLOAD; ONLOAD=null; f() }
  }).catch(function(e){ if(String(e&&e.message)==='retry') return; if(!warned){ warned=true; toast('Couldn’t reach Sway. Trying again shortly.') } })
  .then(function(){ REF.busy=false; if(NOMY&&!S.loaded&&!REF.retried){ REF.retried=true; return liveRefresh() } if(REF.again){ REF.again=false; liveRefresh() } });
}
/* probe optional server features once */
function probe(){
  soft(sb.from('nudges').select('poll_id').limit(1)).then(function(r){ if(r&&!r.error&&Array.isArray(r.data)) { NUDGES=true; refresh() } });
  sb.from('polls').select('hide_asker').limit(1).then(function(r){ if(!r.error){ HAS3=true; refresh() } },function(){});
  sb.from('push_subs').select('endpoint').limit(1).then(function(r){ if(!r.error){ HAS4=true; refreshPush(); refresh() } },function(){});
}

/* ---------- push notifications ---------- */
var IOS=/iPhone|iPad|iPod/.test(navigator.userAgent||''),STANDALONE=!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
var PUSH_OK=LIVE&&!!CFG.vapid&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function pushDenied(){try{return Notification.permission==='denied'}catch(e){return false}}
function pushOn(){try{return !!store.get('sway.push.'+ME)&&Notification.permission==='granted'}catch(e){return false}}
function vapidKey(){var b=CFG.vapid.replace(/-/g,'+').replace(/_/g,'/');b+='==='.slice((b.length+3)%4);return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function saveSub(sub){var j=sub.toJSON();return sb.rpc('save_push_sub',{ep:j.endpoint,k:j.keys.p256dh,a:j.keys.auth})}
function enablePush(){
  if(!PUSH_OK) return;
  Notification.requestPermission().then(function(perm){
    if(perm!=='granted'){ draw('stay'); return toast('Your browser is blocking notifications for this site. Allow them in its settings.') }
    return navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidKey()})}) })
      .then(saveSub).then(function(r){ if(r&&r.error) throw r.error; store.set('sway.push.'+ME,true); draw('stay'); toast('Notifications are on for this device.') });
  }).then(null,function(){ toast('Notifications couldn’t be switched on here. Try again, or use another browser.') });
}
function disablePush(){
  store.set('sway.push.'+ME,false); draw('stay');
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(s){ if(!s) return; var ep=s.endpoint; s.unsubscribe(); return sb.from('push_subs').delete().eq('endpoint',ep) }).then(null,function(){});
  toast('Notifications are off for this device.');
}
function refreshPush(){ if(!PUSH_OK||!HAS4||!pushOn()) return; navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(s){ if(s) return saveSub(s); store.set('sway.push.'+ME,false) }).then(null,function(){}) }

/* ================= accounts and landing ================= */
var AUTH={tab:'signup',err:'',msg:'',busy:false,invite:null,poll:null,pick:null},PENDING=null,PENDQ=null,ONLOAD=null;
function landing(){
  var land=$('#land'),h='<div class="brand">'+I.logo+'sway</div>';
  if(AUTH.poll){
    var P=AUTH.poll,ms=Date.parse(P.closes_at)-now(),g=grad(PENDQ||'x');
    h+='<div class="big" style="background:'+g+';min-height:0"><div class="who"><span class="av" style="background:#fff">'+esc((P.asker_name||'?').slice(0,2).toUpperCase())+'</span><span class="wt"><b>'+esc(P.asker_name)+' wants your vote</b>'+esc(P.circle_name)+' · '+left(ms)+'</span></div><h2>'+esc(P.question)+'</h2>'+
      ((P.options||[]).length&&ms>0?'<div class="ans">'+P.options.map(function(o,i){return '<button data-pick="'+i+'" style="'+(AUTH.pick===i?'outline:3px solid #17132B;outline-offset:2px':'')+'"><span class="k" style="background:'+solid(PENDQ||'x')+'">'+LET[i]+'</span>'+esc(o)+(AUTH.pick===i?'<span style="margin-left:auto">'+I.check+'</span>':'')+'</button>'}).join('')+'</div>':'')+
      '</div><p class="hint" style="font-size:15px">'+(ms<=0?'Voting has closed. Join to see the result.':AUTH.pick!=null?'Got it. Add your first name and your vote is in.':'Tap your answer, add your first name, done. No password needed.')+'</p>';
  } else {
    h+='<h1>Ask your people <em>before</em> you decide.</h1><p class="lede">Post the dilemma. Your closest friends vote in one tap. You get a verdict in minutes, not a group chat that goes nowhere.</p>';
    if(AUTH.invite) h+='<div class="banner">'+I.circles+'<span><b>'+esc(AUTH.invite.owner_name)+'</b> invited you to <b>'+esc(AUTH.invite.name)+'</b>. Join to vote on their questions.</span></div>';
  }
  if(!LIVE){ h+='<form class="authf" data-f="auth"><label class="sr" for="auName">Your first name</label><input class="plain" id="auName" maxlength="24" autocomplete="given-name" placeholder="Your first name"><button class="btn primary wide" type="submit" style="min-height:56px">Try the demo</button></form><p class="hint">This is the demo: example friends, saved nowhere.</p>' }
  else {
    var tabs=(AUTH.invite||AUTH.poll?[['guest','Just vote']]:[]).concat([['signup','Sign up'],['login','Log in']]);
    h+='<div class="seg" role="tablist">'+tabs.map(function(t){return '<button type="button" role="tab" aria-selected="'+(AUTH.tab===t[0])+'" data-auth="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
    h+='<form class="authf" data-f="auth">'+(AUTH.tab!=='login'?'<label class="sr" for="auName">Your first name</label><input class="plain" id="auName" maxlength="24" autocomplete="given-name" placeholder="Your first name">':'')+
      (AUTH.tab!=='guest'?'<label class="sr" for="auEmail">Email</label><input class="plain" id="auEmail" type="email" autocomplete="email" placeholder="Email"><label class="sr" for="auPw">Password</label><input class="plain" id="auPw" type="password" autocomplete="'+(AUTH.tab==='signup'?'new-password':'current-password')+'" placeholder="Password'+(AUTH.tab==='signup'?' (8 or more characters)':'')+'">':'')+
      (AUTH.err?'<p class="err" role="alert">'+esc(AUTH.err)+'</p>':'')+(AUTH.msg?'<p class="okmsg" role="status">'+esc(AUTH.msg)+'</p>':'')+
      '<button class="btn primary wide" type="submit" style="min-height:56px"'+(AUTH.busy?' disabled':'')+'>'+(AUTH.busy?'One moment…':AUTH.tab==='guest'?(AUTH.pick!=null?'Send my vote':'Join and vote'):AUTH.tab==='signup'?'Create my account':'Log in')+'</button>'+
      (AUTH.tab==='login'?'<button type="button" class="linkbtn" data-forgot="1" style="align-self:flex-start">Forgot your password?</button>':'')+'</form>';
  }
  h+='<div class="trust"><span>Private circles only</span><span>No followers, no likes</span><span>A feed that ends</span></div>';
  var keep={}; land.querySelectorAll('input').forEach(function(i){keep[i.id]=i.value});
  land.innerHTML=h; land.querySelectorAll('input').forEach(function(i){ if(keep[i.id]!=null) i.value=keep[i.id] });
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-auth],[data-pick],[data-forgot]'); if(!t||!$('#land').contains(t)) return;
  if(t.dataset.auth){ AUTH.tab=t.dataset.auth; AUTH.err=''; AUTH.msg=''; return landing() }
  if(t.dataset.pick!=null){ AUTH.pick=+t.dataset.pick; AUTH.tab='guest'; buzz(); landing(); var n=$('#auName'); if(n) n.focus(); return }
  if(t.dataset.forgot){ var em=($('#auEmail')||{}).value||''; if(!/^\S+@\S+\.\S+$/.test(em.trim())){ AUTH.err='Type your email above first.'; return landing() }
    sb.auth.resetPasswordForEmail(em.trim(),{redirectTo:location.origin+location.pathname}).then(function(r){ AUTH.err=r.error?(r.error.message||'That didn’t work.'):''; AUTH.msg=r.error?'':'If that email has an account, a reset link is on its way.'; landing() }) }
});
function authErr(m){AUTH.busy=false;AUTH.err=m;landing()}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function doAuth(){
  var nm=val('auName');
  if(!LIVE){ if(!nm) return; S=demo(); S.me.name=nm; return enterApp() }
  if(AUTH.busy) return;
  var email=val('auEmail'),pw=($('#auPw')||{}).value||''; AUTH.err=''; AUTH.msg='';
  if(AUTH.tab!=='login'&&!nm) return authErr('Enter your first name.');
  if(AUTH.tab!=='guest'){ if(!/^\S+@\S+\.\S+$/.test(email)) return authErr('Enter a valid email address.'); if(pw.length<8) return authErr('Use a password of at least 8 characters.') }
  AUTH.busy=true; landing();
  var call=AUTH.tab==='guest'?sb.auth.signInAnonymously({options:{data:{name:nm}}}):AUTH.tab==='signup'?sb.auth.signUp({email:email,password:pw,options:{data:{name:nm}}}):sb.auth.signInWithPassword({email:email,password:pw});
  call.then(function(r){
    if(r.error) return authErr(/invalid login/i.test(r.error.message||'')?'That email and password don’t match.':(r.error.message||'That didn’t work. Try again.'));
    AUTH.busy=false; if(!r.data||!r.data.session){ AUTH.msg='Check your email for a confirmation link, then log in.'; AUTH.tab='login'; return landing() }
    enter(r.data.session.user);
  },function(){ authErr('Couldn’t reach Sway. Check your connection and try again.') });
}
function enter(user){
  if(ME===user.id) return;
  ME=user.id; GUEST=!!user.is_anonymous; S=blank(); var loc=store.get('sway2.'+ME)||{}; S.act=loc.act||[]; S.seen=loc.seen||{}; S.seenV=loc.seenV||null;
  S.me={name:(user.user_metadata&&user.user_metadata.name)||'Friend'};
  enterApp(); probe();
  sb.from('profiles').select('name').eq('id',ME).maybeSingle().then(function(pr){
    if(pr.data){ S.me.name=pr.data.name; return null } return sb.from('profiles').insert({id:ME,name:S.me.name,color:PAL[hash(ME)%PAL.length]});
  }).then(function(){
    if(!PENDING) return null;
    var code=PENDING; PENDING=null; try{ history.replaceState(null,'',location.pathname) }catch(e){}
    return sb.rpc('join_circle',{c:code}).then(function(j){
      store.set('sway.pendingJoin',null);
      if(j.error) return toast('That invite link didn’t work. Ask for a new one.');
      toast('You joined the circle.'); setTimeout(function(){ping([j.data])},1500);
    });
  }).then(function(){
    if(!PENDQ) return; var q=PENDQ,pk=AUTH.pick; PENDQ=null; AUTH.pick=null; store.set('sway.pendingQ',null);
    ONLOAD=function(){ var p=poll(q); if(!p) return; var did=pk!=null&&myTurn(p)&&!!p.opts[pk]; if(did) vote(p.id,pk); go('q',p.id); if(did) toast('Your vote is in.') };
  }).then(liveRefresh,liveRefresh);
}
function enterApp(){
  $('#boot').hidden=true; $('#land').hidden=true; $('#page').hidden=false; $('#tabs').hidden=false;
  tab='vote'; stack=[]; draw('nav');
}
function showLanding(){ $('#boot').hidden=true; $('#page').hidden=true; $('#tabs').hidden=true; $('#land').hidden=false; landing() }
function logout(){
  Object.keys(CH).forEach(function(c){ sb.removeChannel(CH[c]); delete CH[c] });
  var bye=Promise.resolve();
  if(PUSH_OK&&pushOn()) bye=navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(s){ if(s) return sb.from('push_subs').delete().eq('endpoint',s.endpoint) }).then(null,function(){});
  bye.then(function(){return sb.auth.signOut()}).then(function(){ ME=null; GUEST=false; S=blank(); AUTH={tab:'signup',err:'',msg:'',busy:false,invite:null,poll:null,pick:null}; showLanding() });
}
function doNewPw(){ var pw=$('#npw').value,er=$('#npwErr'); if(pw.length<8){ er.textContent='Use at least 8 characters.'; er.hidden=false; return }
  sb.auth.updateUser({password:pw}).then(function(r){ if(r.error){ er.textContent=r.error.message||'That didn’t work.'; er.hidden=false; return } stack=[]; draw('back'); toast('Your password is changed.') }) }
function doSaveAcct(){ var em=val('se'),pw=($('#sp')||{}).value||'',er=$('#seErr'); var bad=!/^\S+@\S+\.\S+$/.test(em)?'Enter a valid email address.':pw.length<8?'Use a password of at least 8 characters.':''; if(bad){ er.textContent=bad; er.hidden=false; return }
  sb.auth.updateUser({email:em,password:pw}).then(function(r){ if(r.error){ er.textContent=r.error.message||'That didn’t work.'; er.hidden=false; return } GUEST=!!(r.data&&r.data.user&&r.data.user.is_anonymous); stack=[]; draw('back'); toast(GUEST?'Check your email to confirm it.':'Your account is saved.') }) }

/* ---------- clocks: tick the countdowns, and notice when a question closes ---------- */
setInterval(function(){
  if(!S||!S.me) return;
  document.querySelectorAll('[data-closes]').forEach(function(el){ el.textContent=left(+el.dataset.closes-now()) });
  var justClosed=S.polls.some(function(p){ return p.closes<=now()&&p.closes>now()-1500 });
  if(justClosed){ if(LIVE) liveSoon(); else refresh() }
},1000);

/* ---------- boot ---------- */
if(!LIVE){ S=blank(); showLanding() }
else {
  var qs=new URLSearchParams(location.search);
  PENDING=(qs.get('join')||'').trim().toUpperCase()||null;
  var pq=qs.get('q')||'';
  if(PENDING){ store.set('sway.pendingJoin',PENDING); if(/^[0-9a-f-]{36}$/i.test(pq)){ PENDQ=pq; store.set('sway.pendingQ',pq) } }
  else { PENDING=store.get('sway.pendingJoin')||null; PENDQ=PENDING?store.get('sway.pendingQ'):null }
  if(PUSH_OK){
    navigator.serviceWorker.register('sw.js').then(null,function(){});
    navigator.serviceWorker.addEventListener('message',function(e){ var q=e.data&&e.data.q; if(!q||!ME) return; ONLOAD=function(){ if(poll(q)) go('q',q) }; liveRefresh() });
  }
  sb.auth.onAuthStateChange(function(ev,ses){ if(ev==='PASSWORD_RECOVERY'&&ses){ enter(ses.user); setTimeout(function(){ go('newpw') },400) } });
  sb.auth.getSession().then(function(r){
    var ses=r.data&&r.data.session;
    if(ses){ if(/^[0-9a-f-]{36}$/i.test(pq)&&!PENDING) ONLOAD=function(){ if(poll(pq)) go('q',pq) }; return enter(ses.user) }
    S=blank(); showLanding();
    if(!PENDING) return;
    Promise.all([soft(sb.rpc('circle_preview',{c:PENDING})),PENDQ?soft(sb.rpc('poll_preview',{code_in:PENDING,poll_in:PENDQ})):{data:[]}]).then(function(rs){
      if(rs[0].data&&rs[0].data[0]){ AUTH.invite=rs[0].data[0]; AUTH.tab='guest' }
      if(rs[1].data&&rs[1].data[0]){ AUTH.poll=rs[1].data[0]; AUTH.tab='guest' }
      landing();
    });
  },function(){ S=blank(); showLanding() });
  setInterval(function(){ if(ME&&!document.hidden) liveRefresh() },20000);
  document.addEventListener('visibilitychange',function(){ if(ME&&!document.hidden) liveRefresh() });
}
})();
</script>
